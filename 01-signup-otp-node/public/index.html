<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo App: sign up</title>
  <style>
    :root { --ink: #0a0a0a; --muted: #525252; --line: #e5e5e5; --accent: #2563eb; --bg: #fafafa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 16px/1.5 ui-monospace, "Geist Mono", SFMono-Regular, Menlo, monospace; }
    main { width: min(420px, calc(100vw - 32px)); background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
    label { display: block; font-size: 13px; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; font: inherit; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 14px; }
    button { width: 100%; padding: 12px; font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: default; }
    #status { min-height: 24px; margin-top: 14px; font-size: 14px; }
    .ok { color: #15803d; } .err { color: #b91c1c; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>Create your account</h1>
    <p>We'll text you a 6-digit code to confirm your phone number.</p>

    <form id="phone-form">
      <label for="phone">Phone number</label>
      <input id="phone" name="phone" type="tel" placeholder="+447700900123" autocomplete="tel" required>
      <button id="send">Send code</button>
    </form>

    <form id="code-form" hidden>
      <label for="code">Verification code</label>
      <input id="code" name="code" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code" required>
      <button id="verify">Verify</button>
    </form>

    <div id="status" role="status"></div>
  </main>
  <script>
    const $ = (id) => document.getElementById(id)
    const status = (msg, cls = '') => { $('status').textContent = msg; $('status').className = cls }
    const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json())

    $('phone-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      $('send').disabled = true
      const r = await post('/api/send-code', { phone: $('phone').value })
      $('send').disabled = false
      if (!r.ok) return status(r.error, 'err')
      $('phone-form').hidden = true
      $('code-form').hidden = false
      $('code').focus()
      status('Code sent. Check your messages.')
    })

    $('code-form').addEventListener('submit', async (e) => {
      e.preventDefault()
      const r = await post('/api/verify', { phone: $('phone').value, code: $('code').value })
      if (!r.ok) return status(r.error, 'err')
      $('code-form').hidden = true
      status('Phone verified. Your account is ready.', 'ok')
    })
  </script>
</body>
</html>
